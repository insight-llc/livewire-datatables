name: Pull Request

on:
  pull_request:

permissions:
  actions: write
  attestations: write
  checks: write
  contents: read
  deployments: read
  discussions: write
  id-token: write
  issues: read
  packages: write
  pull-requests: write
  repository-projects: read
  security-events: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.BOT_PERSONAL_ACCESS_TOKEN }}"} }'

jobs:
  pr-checks:
    name: PR Checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.5]

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: pcov
          ini-values: max_execution_time=900, opcache.enable_cli=1, memory_limit=6G

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress

      - name: Run Snyk
        uses: snyk/actions/php@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk.sarif --severity-threshold=high

      - name: Upload Snyk results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif

      - name: Run tests
        run: php -dxdebug.mode=off -dpcov.enabled=1 -dpcov.directory=. -dpcov.exclude="~vendor~" vendor/bin/pest --ci -dmax_execution_time=900 -dmemory_limit=-1 --coverage-clover=coverage-${{ matrix.php }}.xml

      - uses: codecov/codecov-action@v5
        with:
          files: ./coverage-${{ matrix.php }}.xml
          name: integration
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Set up ReviewDog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.2

      - name: PHPCS code analysis with ReviewDog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          php -d memory_limit=-1 ./vendor/bin/phpcs --report=checkstyle --standard=./phpcs.xml ./src -q \
            | reviewdog -name=PHPCS -f=checkstyle -reporter=github-pr-review -level=warning -diff='git diff' -tee
