# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

reviews:
    auto_review:
        enabled: false

    pre_merge_checks:
        docstrings:
            mode: "off"

    tools:
        # PHPStan runs `composer install` in CodeRabbit's sandbox, which cannot
        # authenticate to the private insight-llc/* packages, so it fails every review.
        phpstan:
            enabled: false

    path_instructions:
        - path: "docs/**"
          instructions: |
              Do not review or comment on any file under `docs/`.

              `docs/review-wiki/` is the record of review decisions already made — a
              comment on an entry re-opens the argument it exists to close. The rest
              of `docs/` is prose written for people.

              Read these files freely. The wiki search required by
              `.github/instructions/review-decisions.instructions.md` still applies:
              this exclusion governs where you leave comments, not what you read.
