codecov:
    require_ci_to_pass: false
    allow_coverage_offsets: true

coverage:
    range: 80..90
    precision: 2
    round: down

comment:
    layout: "header, reach, diff, flags, files, condensed_footer"
    behavior: default
    show_critical_paths: true

profiling:
    fixes:
        - "::src/"
